name: Verify Gson dependency update
on:
  pull_request:
    paths:
      - 'pom.xml'
      - '.github/workflows/verify-gson-update.yml'
jobs:
  maven-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Test and package
        run: mvn -B -ntp verify
